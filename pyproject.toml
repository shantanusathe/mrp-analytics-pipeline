[project]
name = "mrp-analytics-pipeline"
version = "1.0.0"
description = "Real-Time MRP Analytics Platform — AWS Data Engineering Portfolio Project"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "faker>=30.0.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
